[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-eval"
version = "0.1.0"
description = "Local API coding evaluation workbench"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "streamlit>=1.66,<2",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
include = ["coding_eval*", "app*", "datasets"]

# 将同级种子目录作为命名空间数据包安装，兼容现有 SEED_PATH。
[tool.setuptools.package-data]
datasets = ["seed_tasks.json", "reference_tasks.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
